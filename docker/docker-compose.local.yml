services:
  db:
    image: postgres:18
    container_name: nestjs-starter-template-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nestjs-starter-template-db
    ports:
      - "5432:5432"
    volumes:
      - nestjs-starter-template-db-volume:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: nestjs-starter-template-rabbitmq
    ports:
      - "5672:5672" # AMQP protocol
      - "15672:15672" # management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - nestjs-starter-template-rabbitmq-volume:/var/lib/rabbitmq

