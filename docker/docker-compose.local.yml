version: '3.8'
services:
  db:
    image: postgres:18
    container_name: nestjs-starter-template-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nestjs-starter-template-db
    ports:
      - '5432:5432'
    volumes:
      - nestjs-starter-template-db-volume:/var/lib/postgresql/data

  # s3:
  #   image: rustfs/rustfs:latest
